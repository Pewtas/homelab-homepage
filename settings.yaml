---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: "Homepage"
theme: dark # hardcode theme
color: slate # hardcode color palette
background: 
  image: https://images.unsplash.com/photo-1526374073174-7661a8028eb4?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
  blur: sm # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
  saturate: 50 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
  brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 50 # 0-100

providers:
  finnhub: "{{HOMEPAGE_VAR_FINNHUB_API_KEY}}"
  openweathermap: "{{HOMEPAGE_VAR_OPENWEATHERMAP_API_KEY}}"

# Group order + per-group display. Quick Links is a bookmarks.yaml group; without
# this it would render below all services.yaml groups by default.
# https://gethomepage.dev/configs/settings/#layout
layout:
  Quick Links:
    style: row
    columns: 4
    iconsOnly: true # icon-only, no title text - see https://gethomepage.dev/configs/settings/#icons-only-layout
  Top Services:
  Calendar: